<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- shell:head -->
<title>Verify — STILL HERE</title>
<meta name="description" content="Verify a certificate, from STILL HERE.">
</head>
<body>
<!-- shell:header -->
<main>
  <div class="wrap">
    <div class="page-intro">
      <h1 class="display">Verify a certificate</h1>
    </div>
    <form class="verify" autocomplete="off" novalidate>
      <div class="verify-field">
        <label class="label" for="verify-identifier">Certificate identifier</label>
        <input id="verify-identifier" name="identifier" type="text" spellcheck="false" autocapitalize="characters" autocomplete="off" placeholder="SH-XXXX-XXXX-XXXX">
      </div>
      <div class="verify-field">
        <label class="label" for="verify-name">Object name</label>
        <input id="verify-name" name="name" type="text" spellcheck="false" autocapitalize="sentences" autocomplete="off">
      </div>
      <button class="button-primary" type="submit" aria-disabled="true">Verify</button>
      <p class="check-note verify-note" aria-live="polite"></p>
    </form>
    <div class="verify-outcome" aria-live="polite"></div>
  </div>
</main>
<!-- shell:footer -->
<script type="module" src="/js/verify.js"></script>
</body>
</html>
